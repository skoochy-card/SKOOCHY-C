<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#071426">
<meta name="description" content="SKOOCHY CARD - Virtual Card Platform">

<title>SKOOCHY CARD | Virtual Card</title>

<style>
:root {
  --navy: #071426;
  --navy2: #0d2039;
  --gold: #d5ad55;
  --white: #ffffff;
  --gray: #aab5c5;
  --green: #27c58a;
  --border: rgba(255,255,255,.10);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, sans-serif;
  background: var(--navy);
  color: var(--white);
  min-height: 100vh;
}

button, input, select {
  font-family: inherit;
}

button {
  cursor: pointer;
}

a {
  color: inherit;
  text-decoration: none;
}

.container {
  width: 92%;
  max-width: 1200px;
  margin: auto;
}

header {
  background: #091a30;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 100;
}

.navbar {
  min-height: 75px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
}

.logo {
  color: var(--gold);
  font-size: 23px;
  font-weight: 900;
  letter-spacing: 1px;
}

.logo span {
  display: block;
  color: white;
  font-size: 10px;
  letter-spacing: 2px;
  margin-top: 4px;
}

.nav-links {
  display: flex;
  align-items: center;
  gap: 22px;
}

.nav-links a {
  color: var(--gray);
  font-size: 13px;
  transition: .3s;
}

.nav-links a:hover {
  color: var(--gold);
}

.btn {
  border: none;
  padding: 12px 20px;
  border-radius: 8px;
  font-weight: bold;
  transition: .3s;
}

.btn-gold {
  background: var(--gold);
  color: #071426;
}

.btn-gold:hover {
  background: #f0ce7d;
  transform: translateY(-2px);
}

.btn-outline {
  border: 1px solid var(--gold);
  color: var(--gold);
  background: transparent;
}

.btn-outline:hover {
  background: var(--gold);
  color: var(--navy);
}

.menu-btn {
  display: none;
  background: transparent;
  color: var(--gold);
  border: 1px solid var(--gold);
  padding: 9px 13px;
  border-radius: 6px;
  font-size: 20px;
}

main {
  min-height: 75vh;
  padding-bottom: 50px;
}

.section {
  padding: 55px 0;
}

.section-title {
  font-size: 28px;
  margin-bottom: 12px;
}

.section-subtitle {
  color: var(--gray);
  line-height: 1.7;
  margin-bottom: 25px;
}

.card {
  background: var(--navy2);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 22px;
}

.gold-text {
  color: var(--gold);
}

.muted {
  color: var(--gray);
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}

footer {
  background: #06101e;
  border-top: 1px solid var(--border);
  padding: 30px 0;
  text-align: center;
  color: var(--gray);
  font-size: 13px;
  line-height: 2;
}

@media(max-width: 800px) {
  .nav-links {
    display: none;
    position: absolute;
    top: 75px;
    left: 0;
    width: 100%;
    background: #091a30;
    flex-direction: column;
    padding: 25px;
    border-bottom: 1px solid var(--gold);
  }

  .nav-links.active {
    display: flex;
  }

  .menu-btn {
    display: block;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  .section-title {
    font-size: 24px;
  }
}

@media(max-width: 380px) {
  .logo {
    font-size: 19px;
  }

  .container {
    width: 94%;
  }
}
</style>
</head>

<body>

<header>
  <div class="container navbar">

    <a href="#" class="logo">
      SKOOCHY CARD
      <span>VIRTUAL CARD • CARTE VIRTUELLE</span>
    </a>

    <nav class="nav-links" id="navLinks">
      <a href="#home">Home</a>
      <a href="#services">Services</a>
      <a href="#dashboard">Dashboard</a>
      <a href="#cards">My Cards</a>
      <a href="#wallet">My Wallet</a>
    </nav>

    <button class="menu-btn" id="menuBtn">
      ☰
    </button>

  </div>
</header>

<main>
</main>

<footer>
  <div class="container">
    <h3 class="gold-text">SKOOCHY CARD</h3>
    Virtual Card – Carte Virtuelle
    <p>© 2026 SKOOCHY CARD. All rights reserved.</p>
    <p>Demonstration platform – No real financial transactions.</p>
  </div>
</footer>
</body>
</html>
